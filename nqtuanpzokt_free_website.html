<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>nqtuanpzokt</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #111827, #1f2937);
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .card {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
      padding: 40px;
      border-radius: 25px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 0 25px rgba(0,0,0,0.4);
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 15px;
      color: #60a5fa;
    }

    p {
      font-size: 1.1rem;
      color: #d1d5db;
      margin-bottom: 25px;
    }

    .btn {
      display: inline-block;
      padding: 12px 25px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 12px;
      transition: 0.3s;
      font-weight: bold;
    }

    .btn:hover {
      background: #1d4ed8;
      transform: scale(1.05);
    }

    footer {
      margin-top: 25px;
      color: #9ca3af;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>nqtuanpzokt</h1>
    <p>Website miễn phí được tạo bằng HTML + CSS.</p>

    <a class="btn" href="https://github.com" target="_blank">
      GitHub
    </a>

    <footer>
      © 2026 nqtuanpzokt
    </footer>
  </div>
</body>
</html>
